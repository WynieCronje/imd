<section
  class="pc"
  [class.pc--orange-on-navy]="card.variant === 'orange-on-navy'"
  [class.pc--navy-on-orange]="card.variant === 'navy-on-orange'"
  [id]="card.id"
  [attr.aria-labelledby]="'pc-heading-' + card.id"
>
  <div class="container">
    <!-- A "window" panel with an offset card peeking out behind it. -->
    <div class="pc__frame">
      <div class="pc__window">
        <header class="pc__head">
          <span class="pc__dot" aria-hidden="true"></span>
          <h3 class="pc__title heading" [id]="'pc-heading-' + card.id">{{ card.title }}</h3>
          <svg class="pc__close" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path d="M3 3 29 29M29 3 3 29" />
          </svg>
        </header>

        <div class="pc__body">
          @if (card.intro) {
            <p class="pc__intro">{{ card.intro }}</p>
          }
          @if (card.note) {
            <p class="pc__note">{{ card.note }}</p>
          }

          <div class="pc__content">
            <ul class="pc__list">
              @for (item of card.items; track item) {
                <li>{{ item }}</li>
              }
            </ul>
            @if (card.illustrationSrc) {
              <img
                class="pc__illustration"
                [src]="card.illustrationSrc"
                [alt]="card.illustrationAlt || ''"
                width="560"
                height="525"
                loading="lazy"
                decoding="async"
              />
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
